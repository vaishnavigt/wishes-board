<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload a Selfie</title>
  <link rel="stylesheet" href="style.css">
  <meta name="description" content="Upload your selfie or group photo anonymously for the housewarming wishes board.">
</head>
<body>
  <header class="hero small">
    <div class="overlay"></div>
    <div class="hero-content">
      <h1 id="eventName">MohanBabu & Priya<br>Gangadharan & Vaishnavi</h1>
      <p class="sub">Welcomes you all for our House warming function</p>
      <div class="cta-row" style="margin-top: 20px;">
        <a id="wishButton" class="cta" href="https://forms.office.com/r/7apcbEGixC" target="_blank" rel="noopener">Leave Your Wishes</a>
        <a class="cta outline" href="index.html">← Back to Home</a>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="upload-section">
      <p class="note">Thank you for joining us in our celebration!</p>
    </section>
  </main>

  <footer>
    <small>© <span id="year"></span> Wishes Board</small>
  </footer>

  <!-- 1) Load the latest config (cache-busted) -->
  <script src="config.js?v=4"></script>
  <!-- 2) Update wish button with form URL from config -->
  <script>
    (function () {
      const cfg = window.WISHES_CONFIG || {};
      // Update wish button with form URL from config
      const wishBtn = document.getElementById('wishButton');
      if (cfg.wishFormUrl && wishBtn) {
        wishBtn.href = cfg.wishFormUrl;
      }
      const year = document.getElementById('year');
      year.textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
